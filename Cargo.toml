[package]
name = "ldtk-mcp"
version = "0.1.0"
edition = "2021"
description = "Model Context Protocol server for editing LDtk (.ldtk) projects so agents can generate game levels"
license = "MIT"

[[bin]]
name = "ldtk-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7.0", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON key ordering stable so we don't churn the whole file on save
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.46.5", default-features = false }
png = "0.17"
base64 = "0.22"

[lints.clippy]
# priority -1 so individual lint keys below can override the group.
pedantic = { level = "warn", priority = -1 }

# The LDtk model is i64 everywhere, because that is what serde_json parses integers into. The
# rasterizer indexes u32/usize buffers and writes u8 channels, and grid geometry rounds through
# f64, so crossing between those worlds is constant and deliberate. Each site is already guarded
# where it matters: blend() returns early when a coordinate falls outside the canvas, the flood
# fill range-checks against cw/ch before indexing, and the scale math clamps with max(1). Writing
# try_from at each of the ~65 sites would either add a panic path or substitute a wrong index on
# failure, so the group stays on and these four come off.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
